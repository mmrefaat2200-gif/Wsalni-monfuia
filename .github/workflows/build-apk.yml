name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Install Capacitor CLI and Android
        run: npm install @capacitor/cli @capacitor/android

      - name: Add Android
        run: npx cap add android

      - name: Add location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = """
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          """

          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text.replace(marker, marker + permissions)

          path.write_text(text)

          print("Location permissions added successfully.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Show Android Manifest
        run: cat android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wsalni-Monfuia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
