<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق التوصيل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط البحث فوق الخريطة -->
  <div class="search-box">
    <input id="search-input" type="text" placeholder="اكتب مكان النزول (مثلاً: شبرا الخيمة)..." />
  </div>

  <!-- الخريطة -->
  <div id="map"></div>

  <!-- أزرار التحكم والعمليات -->
  <div class="controls-panel">
    <button id="btn-pickup" onclick="getCurrentLocation()">تحديد موقع الإقلاع (موقعي الحالي)</button>
    <button id="btn-dropoff" onclick="confirmDropoff()">تأكيد موقع النزول بالدبوس</button>
    <button id="btn-request" onclick="sendRideRequest()" style="display:none; background-color: #28a745;">طلب الرحلة الآن</button>
  </div>

  <!-- لوحة استقبال الطلبات لملف الكابتن -->
  <div id="captain-panel" class="captain-panel" style="display: none;">
    <h3>طلب رحلة جديد!</h3>
    <p id="ride-info">جاري تحميل البيانات...</p>
    <div class="captain-actions">
      <button onclick="acceptRide()" style="background-color: #28a745;">قبول</button>
      <button onclick="rejectRide()" style="background-color: #dc3545;">رفض</button>
      <button onclick="counterOffer()" style="background-color: #ffc107;">تعديل السعر</button>
    </div>
  </div>

  <!-- استدعاء مكتبة Google Maps مع مفتاح الـ API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places&callback=initMap" async defer></script>
  
  <!-- ملفات Firebase و JavaScript الخاصة بك -->
  <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>
  <script src="main.js"></script>
</body>
</html>
